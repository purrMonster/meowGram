<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="description" content="meowGram cross-platform chat client">

  <!-- iOS PWA meta tags & icons -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="meowGram">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="apple-touch-icon" sizes="512x512" href="icons/Icon-512.png">

  <!-- Standard & PWA meta tags -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#6750A4">

  <title>meowGram</title>
  <link rel="icon" type="image/png" href="favicon.png"/>
  <link rel="manifest" href="manifest.json">

  <!-- Service Worker Registration for PWA & CanvasKit Caching -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function () {
        navigator.serviceWorker.register('sw.js');
      });
    }
  </script>
  <!-- Logo splash until Flutter paints its first frame. -->
  <style>
    body { margin: 0; background: #FDF8FF; }
    @media (prefers-color-scheme: dark) { body { background: #141218; } }
    #splash { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; }
    #splash img { width: 96px; height: 96px; border-radius: 22.5%; }
  </style>
</head>
<body>
  <div id="splash"><img src="icons/Icon-192.png" alt="meowGram"></div>
  <script>
    window.addEventListener("flutter-first-frame", function () {
      var splash = document.getElementById("splash");
      if (splash) splash.remove();
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
