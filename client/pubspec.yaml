name: meowgram_client
description: "meowGram cross-platform chat client (Flutter)"
publish_to: "none"
version: 1.1.0+3

environment:
  sdk: ^3.5.0
  flutter: ">=3.24.0"

dependencies:
  app_links: ^7.2.1
  crypto: ^3.0.7
  firebase_core: ^4.15.0
  firebase_messaging: ^16.7.0
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.1
  flutter_local_notifications: ^22.3.1
  flutter_secure_storage: ^11.2.0
  go_router: ^14.8.1
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  http: ^1.6.0
  intl: ^0.20.3
  jose: ^0.3.5+2
  openid_client: ^0.4.10+2
  url_launcher: ^6.3.3
  web: ^1.1.1
  web_socket_channel: ^3.0.3
  workmanager: ^0.10.10

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.3

# Icon sources are rendered from ../brand/*.svg by ../brand/render.sh.
flutter_launcher_icons:
  android: "launcher_icon"
  image_path_android: "assets/icon/icon.png"
  adaptive_icon_background: "#6A4FCB"
  adaptive_icon_foreground: "assets/icon/icon_foreground.png"
  adaptive_icon_monochrome: "assets/icon/icon_monochrome.png"
  min_sdk_android: 21
  ios: true
  image_path_ios: "assets/icon/icon.png"
  remove_alpha_ios: true
  web:
    generate: true
    image_path: "assets/icon/icon.png"
    background_color: "#6750A4"
    theme_color: "#6750A4"
  windows:
    generate: true
    image_path: "assets/icon/icon_rounded.png"
    icon_size: 256
  macos:
    generate: true
    image_path: "assets/icon/icon_rounded.png"

flutter:
  uses-material-design: true
  assets:
    - assets/brand/logo.png

