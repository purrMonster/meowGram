name: Scratch verification
on:
  pull_request:
  push:
    branches: [main, 'test/**', 'fix/**', 'feat/**', 'refactor/**']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  legacy-decoder:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Actual v2.0.0 decoder positive controls in both timezones
        run: sh deploy/scripts/verify-legacy-decoder.sh
  directory:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Isolated LLDAP compatibility and identity lifecycle
        run: sh deploy/scripts/verify-directory.sh

  bot-auth:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Go authentication against isolated LLDAP 0.6.3
        run: sh deploy/scripts/verify-bot-auth.sh
  api-acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Real server, PostgreSQL and pinned LDAPS API acceptance
        run: sh deploy/scripts/verify-api-acceptance.sh
  rollback:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Previous-release rollback and forward migration drill
        run: sh deploy/scripts/verify-rollback.sh
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Go, PostgreSQL, restore, Flutter and web
        run: sh deploy/scripts/verify.sh
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Android debug APK with synthetic Firebase configuration
        run: docker compose -p meowgram-android-ci -f deploy/verify.compose.yml run --build --rm android
      - name: Remove scratch resources
        if: always()
        run: docker compose -p meowgram-android-ci -f deploy/verify.compose.yml down --volumes --remove-orphans
